<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Acompanhe sua gestão · Franco Souza</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Work+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--navy:#2E3A5C;--navy-soft:#46557E;--gold:#D9B36A;--gold-soft:#F6EEDC;--bg:#F7F5F1;--card:#FFFFFF;--ink:#2B3248;--ink2:#5C6380;--ink3:#8C91A4;--line:#ECE8E0;--good:#3E9A6B;
--fd:"Fraunces",Georgia,serif;--fb:"Work Sans",-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
header{background:linear-gradient(160deg,var(--navy) 0%,var(--navy-soft) 100%);color:#fff;border-radius:0 0 28px 28px}
header .wrap{padding-block:28px 30px}
.brand{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.7);font-weight:500}
h1{font-family:var(--fd);font-weight:500;font-size:clamp(26px,5.5vw,34px);margin:8px 0 4px;letter-spacing:-.01em;text-wrap:balance}
.upd{font-size:13px;color:rgba(255,255,255,.72)}
main.wrap{padding-block:22px 56px;display:flex;flex-direction:column;gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 6px 24px rgba(46,58,92,.06)}
.addr{font-family:var(--fd);font-size:21px;font-weight:500;margin:0;text-wrap:balance}
.sub{color:var(--ink3);font-size:13px;margin-top:2px}
.price{display:inline-block;font-size:14px;font-weight:500;margin-top:12px;color:var(--ink2);background:var(--bg);padding:5px 12px;border-radius:99px}
.steps{display:flex;gap:6px;margin:20px 0 8px}
.steps div{flex:1;height:6px;border-radius:99px;background:var(--line);transition:background .3s}
.steps div.done{background:var(--gold)}
.steps div.now{background:var(--navy-soft)}
.stepname{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink3)}
.etapa{display:inline-block;background:var(--gold-soft);color:#8A6A2A;font-weight:500;font-size:13px;padding:5px 14px;border-radius:99px;margin-top:14px}
.msg{margin:10px 0 0;color:var(--ink2)}
h3{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);font-weight:500;margin:26px 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kpi{background:var(--bg);border-radius:16px;padding:14px 14px 12px}
.kpi b{display:block;font-family:var(--fd);font-size:26px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.15;color:var(--navy)}
.kpi span{font-size:12.5px;color:var(--ink2)}
.portais{display:flex;flex-wrap:wrap;gap:8px}
.portais span{background:var(--bg);border-radius:99px;padding:5px 12px;font-size:13px}
.portais em{font-style:normal;color:var(--ink3);margin-left:2px}
ol.tl{list-style:none;margin:0;padding:0 0 0 2px;border-left:2px solid var(--line)}
ol.tl li{position:relative;padding:0 0 14px 18px;font-size:14px}
ol.tl li::before{content:"";position:absolute;left:-6px;top:7px;width:10px;height:10px;border-radius:50%;background:var(--card);border:2px solid var(--gold)}
ol.tl time{display:block;font-size:12px;color:var(--ink3)}
ol.tl small{display:block;color:var(--ink2)}
.note{font-size:12.5px;color:var(--ink3);margin-top:10px}
.contact{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}
.btn{display:inline-block;background:var(--good);color:#fff;text-decoration:none;font-weight:500;padding:11px 20px;border-radius:99px;box-shadow:0 4px 14px rgba(62,154,107,.25)}
.empty{text-align:center;padding:44px 20px;color:var(--ink2)}
footer{text-align:center;font-size:12px;color:var(--ink3);padding:0 18px 36px}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="brand">Franco Souza · Corretor e arquiteto</div>
  <h1 id="ola">Acompanhe a sua gestão</h1>
  <div class="upd" id="upd"></div>
</div></header>
<main class="wrap" id="app"><div class="card empty">Carregando…</div></main>
<footer>Números do sistema de gestão e dos portais, atualizados automaticamente várias vezes ao dia.</footer>
<script>
(function(){
  var NOMES=["Contrato","Documentos","Jurídico","Fotos","No ar","Proposta","Vendido"];
  var ETAPA={documentacao:"Documentação",juridico:"Análise jurídica",cadastro:"Fotos e cadastro",anunciado:"Anunciado",proposta:"Proposta em andamento",vendido:"Vendido"};
  var app=document.getElementById("app");
  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
  function brl(v){return v?"R$ "+Number(v).toLocaleString("pt-BR"):""}
  function num(v){return (v==null?0:v).toLocaleString("pt-BR")}
  function dataBR(iso){if(!iso)return"";var p=iso.slice(0,10).split("-");return p[2]+"/"+p[1]+"/"+p[0]}
  function erro(t){app.innerHTML='<div class="card empty">'+t+'</div>'}
  var c=new URLSearchParams(location.search).get("c");
  if(!c||!/^[A-Za-z0-9_-]{8,40}$/.test(c)){erro("Link incompleto. Use o link que o Franco enviou pelo WhatsApp.");return}
  // Dados cifrados no GitHub; só quem tem o código do link consegue abrir.
  var DADOS="https://raw.githubusercontent.com/francodesouzaferreira/gestoes-dados/main/d/";
  var enc=new TextEncoder();
  function b64(s){return Uint8Array.from(atob(s),function(ch){return ch.charCodeAt(0)})}
  function hex(buf){return Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,"0")}).join("")}
  crypto.subtle.digest("SHA-256",enc.encode(c)).then(function(h){
    return fetch(DADOS+hex(h).slice(0,32)+".json?t="+Date.now(),{cache:"no-store"});
  }).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(pkg){
    return crypto.subtle.importKey("raw",enc.encode(c),"PBKDF2",false,["deriveKey"]).then(function(base){
      return crypto.subtle.deriveKey({name:"PBKDF2",salt:enc.encode("ferreirasouza-gestao-v1"),iterations:100000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
    }).then(function(key){return crypto.subtle.decrypt({name:"AES-GCM",iv:b64(pkg.iv)},key,b64(pkg.ct))});
  }).then(function(buf){render(JSON.parse(new TextDecoder().decode(buf)))})
  .catch(function(){erro("Não encontramos esta gestão. Confira o link ou fale com o Franco.")});
  function kpi(v,l){return '<div class="kpi"><b>'+num(v)+'</b><span>'+l+'</span></div>'}
  function render(d){
    document.getElementById("ola").textContent="Olá, "+d.cliente+"!";
    var dt=new Date(d.atualizado);
    document.getElementById("upd").textContent="Atualizado em "+dt.toLocaleDateString("pt-BR")+" às "+dt.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
    var h="";
    d.imoveis.forEach(function(im){
      var idx=im.etapa_idx, s="";
      for(var i=0;i<NOMES.length;i++) s+='<div class="'+(i<idx?"done":i==idx?"now":"")+'" title="'+NOMES[i]+'"></div>';
      h+='<section class="card"><p class="addr">'+esc(im.endereco)+'</p><div class="sub">'+esc(im.bairro)+(im.inicio?' · gestão desde '+dataBR(im.inicio):'')+'</div>';
      if(im.valor) h+='<div class="price">Valor de venda: '+brl(im.valor)+'</div>';
      h+='<div class="steps">'+s+'</div><div class="stepname"><span>Contrato</span><span>No ar</span><span>Vendido</span></div>';
      h+='<span class="etapa">'+esc(ETAPA[im.etapa]||im.etapa)+'</span><p class="msg">'+esc(im.mensagem)+'</p>';
      var n=im.nonstop;
      if(n){
        h+='<h3>Desempenho'+(n.dias?' · '+n.dias+' dias em gestão':'')+'</h3><div class="grid">'+
          kpi(n.views_clientes,"visualizações de compradores")+kpi(n.views_parceiros,"visualizações de corretores")+
          kpi(n.anuncios_portais,"anúncios em portais")+kpi(n.sites_parceiros,"sites parceiros")+
          kpi(n.compartilhamentos,"compartilhamentos")+kpi(n.contatos_corretores,"contatos de corretores")+
          kpi(n.leads,"interessados (leads)")+kpi(n.visitas,"visitas")+'</div>';
        if(n.rede_corretores) h+='<p class="note">Seu imóvel está disponível para uma rede de '+num(n.rede_corretores)+' corretores parceiros.</p>';
        if(n.portais&&n.portais.length){h+='<h3>Onde está anunciado</h3><div class="portais">';n.portais.forEach(function(p){h+='<span>'+esc(p.portal)+' <em>'+num(p.publicacoes)+'</em></span>'});h+='</div>'}
        if(n.data) h+='<p class="note">Números do relatório de '+dataBR(n.data)+'.</p>';
      }
      if(im.linha_tempo&&im.linha_tempo.length){h+='<h3>O que já foi feito</h3><ol class="tl">';im.linha_tempo.forEach(function(e){h+='<li><time>'+esc(e.data)+'</time>'+esc(e.evento)+(e.det?'<small>'+esc(e.det)+'</small>':'')+'</li>'});h+='</ol>'}
      h+='</section>';
    });
    var k=d.contato||{};
    h+='<section class="card contact"><div><b>'+esc(k.nome)+'</b><div class="sub">'+esc(k.papel)+' · (11) 91323-0134</div></div><a class="btn" href="https://wa.me/'+esc(k.whatsapp)+'" target="_blank" rel="noopener">Falar no WhatsApp</a></section>';
    app.innerHTML=h;
  }
})();
</script>
</body>
</html>
